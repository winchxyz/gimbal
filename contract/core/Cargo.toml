[package]
name = "gimbal-core"
version = "0.1.0"
edition = "2021"
description = "Pure logic of the Gimbal contract: decimals, refusals, policy, action builders and digests; no near-sdk"
license = "BUSL-1.1"
publish = false

[dependencies]
borsh = { version = "1", features = ["derive"] }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
# 1Click quotes are JSON (near-sdk links the same crate).
serde_json = "1"

[dev-dependencies]
# keccak256 and sha256 for the tests; the contract passes the host's.
sha3 = "0.10"
sha2 = "0.10"
# The Ed25519 decompression Solana runs, to cross-check the off-curve test.
curve25519-dalek = "4"
# Ed25519 verification of 1Click's quote signatures; the contract passes the host's.
ed25519-dalek = "2"
